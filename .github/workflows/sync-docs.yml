name: sync-docs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull upstream docs
        run: |
          rm -rf /tmp/pgop docs-source
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/canonical/postgresql-operator /tmp/pgop
          cd /tmp/pgop
          git sparse-checkout set docs config.yaml actions.yaml metadata.yaml src
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs-source
          cp -r /tmp/pgop/docs docs-source/
          cp /tmp/pgop/*.yaml docs-source/
          cp -r /tmp/pgop/src docs-source/

      - name: Commit if changed
        run: |
          git config user.name  github-actions
          git config user.email actions@github.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync upstream docs"
          git push
